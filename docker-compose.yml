services:
  postgres:
    image: postgres:16-alpine
    container_name: bookhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookhub_db
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: myadmin
    ports:
      - "5434:5432"
    volumes:
      - bookhub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d bookhub_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bookhub_pgdata:
